<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Booth Web</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    .row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    label { font-weight: 600; }
    button { padding: 8px 12px; }
    #preview { max-width: 100%; margin-top: 12px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
    .card img { width: 100%; height: auto; border-radius: 6px; }
    .muted { color: #666; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>AI Booth</h1>

  <div class="row">
    <label for="category">Style Category</label>
    <select id="category">
      <option value="background">background</option>
      <option value="retheme">retheme</option>
    </select>

    <label for="style">Style</label>
    <select id="style"></select>
  </div>

  <div class="row">
    <label for="file">Photo</label>
    <input id="file" type="file" accept="image/*" capture="environment" />
    <button id="submit">Edit</button>
  </div>

  <div class="row">
    <button id="startCam">Start Camera</button>
    <button id="capture">Capture & Edit</button>
  </div>

  <video id="live" autoplay playsinline muted style="max-width:100%;border:1px solid #ddd;border-radius:8px"></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <img id="preview" alt="preview" />

  <div id="status" class="muted"></div>

  <h2>Results</h2>
  <div id="results" class="gallery"></div>

  <hr/>
  <h2>Create a new prompt</h2>
  <div class="row">
    <label for="newCat">Category</label>
    <select id="newCat">
      <option value="background">background</option>
      <option value="retheme">retheme</option>
    </select>
    <label for="newName">Name</label>
    <input id="newName" placeholder="e.g. corporate_branding"/>
  </div>
  <div class="row" style="flex-direction:column; align-items:stretch; max-width:800px;">
    <label for="newText">Prompt text</label>
    <textarea id="newText" rows="6" style="width:100%;"></textarea>
  </div>
  <div class="row">
    <button id="savePrompt">Save Prompt</button>
  </div>

  <script>
    const categoryEl = document.getElementById('category');
    const styleEl = document.getElementById('style');
    const fileEl = document.getElementById('file');
    const submitEl = document.getElementById('submit');
    const previewEl = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const startCamEl = document.getElementById('startCam');
    const captureEl = document.getElementById('capture');
    const liveEl = document.getElementById('live');
    const canvasEl = document.getElementById('canvas');
    const newCatEl = document.getElementById('newCat');
    const newNameEl = document.getElementById('newName');
    const newTextEl = document.getElementById('newText');
    const savePromptEl = document.getElementById('savePrompt');

    async function loadStyles() {
      const cat = categoryEl.value;
      statusEl.textContent = 'Loading styles...';
      try {
        const res = await fetch(`/styles?category=${encodeURIComponent(cat)}`);
        const data = await res.json();
        styleEl.innerHTML = '';
        for (const s of data.styles) {
          const opt = document.createElement('option');
          opt.value = s.path; // relative path
          opt.textContent = s.name;
          styleEl.appendChild(opt);
        }
        statusEl.textContent = '';
      } catch (e) {
        statusEl.textContent = 'Failed to load styles';
      }
    }

    categoryEl.addEventListener('change', loadStyles);

    fileEl.addEventListener('change', () => {
      const file = fileEl.files && fileEl.files[0];
      if (!file) { previewEl.src = ''; return; }
      const url = URL.createObjectURL(file);
      previewEl.src = url;
    });

    function appendResults(urls) {
      for (const url of urls) {
        const card = document.createElement('div');
        card.className = 'card';
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'result';
        const link = document.createElement('a');
        link.href = url; link.textContent = 'Open'; link.target = '_blank';
        card.appendChild(img);
        card.appendChild(link);
        resultsEl.prepend(card);
      }
    }

    submitEl.addEventListener('click', async () => {
      const file = fileEl.files && fileEl.files[0];
      const stylePath = styleEl.value;
      if (!file || !stylePath) {
        statusEl.textContent = 'Select a style and an image first.';
        return;
      }
      statusEl.textContent = 'Uploading and editing...';
      const fd = new FormData();
      fd.append('file', file);
      fd.append('style_path', stylePath);
      // editor_model can be customized later; default on server is gemini-2.5-flash-image

      try {
        const resp = await fetch('/edit', { method: 'POST', body: fd });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: 'Unknown error'}));
          throw new Error(err.detail || 'Failed');
        }
        const data = await resp.json();
        statusEl.textContent = 'Done!';
        appendResults(data.files);
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
      }
    });

    // Live camera controls
    let liveStream;
    startCamEl.addEventListener('click', async () => {
      statusEl.textContent = 'Requesting camera...';
      try {
        try {
          liveStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: 'environment' } } });
        } catch {
          liveStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        }
        liveEl.srcObject = liveStream;
        statusEl.textContent = 'Camera started';
      } catch (e) {
        statusEl.textContent = 'Camera access denied: ' + e.message;
      }
    });

    captureEl.addEventListener('click', async () => {
      if (!liveEl.srcObject) { statusEl.textContent = 'Start camera first'; return; }
      const stylePath = styleEl.value;
      if (!stylePath) { statusEl.textContent = 'Select a style first.'; return; }
      const vw = liveEl.videoWidth, vh = liveEl.videoHeight;
      if (!vw || !vh) { statusEl.textContent = 'Camera not ready yet'; return; }
      canvasEl.width = vw; canvasEl.height = vh;
      const ctx = canvasEl.getContext('2d');
      ctx.drawImage(liveEl, 0, 0, vw, vh);
      statusEl.textContent = 'Capturing...';
      canvasEl.toBlob(async (blob) => {
        if (!blob) { statusEl.textContent = 'Capture failed'; return; }
        const fd = new FormData();
        fd.append('file', blob, 'capture.jpg');
        fd.append('style_path', stylePath);
        statusEl.textContent = 'Uploading and editing...';
        try {
          const resp = await fetch('/edit', { method: 'POST', body: fd });
          if (!resp.ok) {
            const err = await resp.json().catch(() => ({ detail: 'Unknown error'}));
            throw new Error(err.detail || 'Failed');
          }
          const data = await resp.json();
          statusEl.textContent = 'Done!';
          appendResults(data.files);
        } catch (e) {
          statusEl.textContent = 'Error: ' + e.message;
        }
      }, 'image/jpeg', 0.95);
    });

    // init
    loadStyles();

    // Save prompt
    savePromptEl.addEventListener('click', async () => {
      const name = (newNameEl.value || '').trim();
      const category = newCatEl.value;
      const text = (newTextEl.value || '').trim();
      if (!name || !text) { statusEl.textContent = 'Enter a name and prompt text.'; return; }
      statusEl.textContent = 'Saving prompt...';
      try {
        const resp = await fetch('/prompts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, category, text })
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: 'Unknown error' }));
          throw new Error(err.detail || 'Failed');
        }
        await loadStyles();
        statusEl.textContent = 'Saved. New style added.';
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
      }
    });
  </script>
</body>
</html>
